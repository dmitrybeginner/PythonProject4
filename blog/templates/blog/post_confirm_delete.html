{% extends 'base.html' %}

{% block title %}Удаление записи - SkyStore{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <h1 class="display-4 mb-4">Удаление записи</h1>
            
            <div class="alert alert-danger">
                <p>Вы уверены, что хотите удалить запись "{{ object.title }}"?</p>
                <p>Это действие нельзя отменить.</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Да, удалить</button>
                    <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
