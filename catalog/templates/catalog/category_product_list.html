{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2 class="my-4">Продукты в категории: {{ category.name }}</h2>
    <div class="row">
        {% for product in products %}
        <div class="col-md-4">
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text">{{ product.description|truncatewords:20 }}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group">
                            <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-sm btn-outline-secondary">Подробнее</a>
                        </div>
                        <small class="text-muted">{{ product.price }} руб.</small>
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col">
            <p>В этой категории пока нет продуктов.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
